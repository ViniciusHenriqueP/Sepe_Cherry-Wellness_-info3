<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Wellness - Ritmo em Movimento</title>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; transition: background-color 0.5s ease; }

        body { 
            font-family: 'Atkinson Hyperlegible', sans-serif; 
            background-color: #FBF9F4; 
            color: #3D1111; 
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        body.modo-escuro-osu {
            background-color: #0A0505 !important;
        }

        body.modo-escuro-osu .navbar,
        body.modo-escuro-osu .footer,
        body.modo-escuro-osu .game-info {
            opacity: 0.1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 10px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            z-index: 10;
        }

        .game-info {
            text-align: center;
            margin-bottom: 10px;
        }

        /* Placar de Pontos */
        .score-display {
            font-size: 18px;
            font-weight: bold;
            color: #3D1111;
            margin-bottom: 5px;
        }

        body.modo-escuro-osu .score-display {
            color: #ffffff;
        }

        /* Barra de Vida */
        .health-bar-container {
            width: 100%;
            max-width: 360px;
            height: 20px;
            background: #E6DEC9;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 2px solid #3D1111;
        }

        .health-bar-fill {
            width: 50%;
            height: 100%;
            background-color: #458b40;
            transition: width 0.2s ease, background-color 0.2s ease;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 420px;
            background-color: #F9F5EB;
            border: 4px solid #3D1111;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: box-shadow 0.5s ease;
        }

        body.modo-escuro-osu .game-container {
            box-shadow: 0 0 35px rgba(255, 60, 60, 0.4);
            border-color: #ff4747;
        }

        .receptors {
            display: flex;
            width: 100%;
            height: 60px;
            border-bottom: 2px dashed #E6DEC9;
            background: #FDFBF4;
            position: relative;
        }

        .receptor-lane {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .receptor {
            font-size: 32px;
            color: #D1C4B2;
            transition: transform 0.1s ease, opacity 0.1s ease;
            opacity: 0.4;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Movimentação Suave dos Receptores */
        .mov-alt-0 { animation: mover0 3.0s ease-in-out infinite alternate; }
        .mov-alt-1 { animation: mover1 3.4s ease-in-out infinite alternate; }
        .mov-alt-2 { animation: mover2 2.8s ease-in-out infinite alternate; }
        .mov-alt-3 { animation: mover3 3.2s ease-in-out infinite alternate; }

        @keyframes mover0 { 0% { transform: translateY(0px); } 100% { transform: translateY(18px); } }
        @keyframes mover1 { 0% { transform: translateY(16px); } 100% { transform: translateY(-5px); } }
        @keyframes mover2 { 0% { transform: translateY(-5px); } 100% { transform: translateY(14px); } }
        @keyframes mover3 { 0% { transform: translateY(12px); } 100% { transform: translateY(0px); } }

        .receptor.active {
            transform: scale(1.25);
            opacity: 1;
            color: #3D1111;
        }

        .note {
            position: absolute;
            width: 25%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            z-index: 5;
        }

        .note.teleport {
            animation: flashTeleport 0.4s ease;
        }

        @keyframes flashTeleport {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Texto Flutuante de Precisão (PERFECT, GOOD, OK) */
        .hit-feedback {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            z-index: 20;
            animation: subirEsumir 0.6s ease-out forwards;
        }

        @keyframes subirEsumir {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-25px) scale(1.2); }
        }

        .touch-controls {
            display: flex;
            width: 100%;
            max-width: 360px;
            gap: 10px;
            margin-top: 15px;
        }

        .touch-btn {
            flex: 1;
            padding: 15px 0;
            background-color: #3D1111;
            color: #FDFBF4;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.1s, transform 0.1s;
        }

        .touch-btn:active {
            background-color: #6E5A5A;
            transform: scale(0.95);
        }

        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(61, 17, 17, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            text-align: center;
            padding: 25px;
            gap: 15px;
            overflow-y: auto;
        }

        .dificuldade-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 220px;
            margin-top: 10px;
        }

        .btn-dificuldade {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            color: white;
        }

        .btn-dificuldade:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .btn-facil { background-color: #275923; }
        .btn-medio { background-color: #C28200; }
        .btn-dificil { background-color: #A62B2B; }

        .btn-game {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background-color: #FDFBF4;
            color: #3D1111;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-game:hover {
            transform: scale(1.05);
            background-color: #E2D7C5;
        }

        @media (min-width: 768px) {
            .game-container { height: 480px; }
            .touch-controls { display: none; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-area">
            <img src="IMG/logo.png" alt="Cherry Wellness Logo" class="logo-img">
            <span class="logo-text">Cherry Wellness</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="movimento.html" class="active">Vida em movimento</a>
            <a href="alimentacao.html">Prato & Saúde</a>
            <a href="#">Bem-Estar mental</a>
            <a href="emblemas.html">Emblemas & Minijogos</a>
        </nav>
    </header>

    <main class="game-screen">
        <div class="game-info">
            <h2 style="font-weight: bold; font-size: 22px;">Ritmo em Movimento</h2>
            <p style="color: #6E5A5A; font-size: 14px;">Use <b>WASD</b>, <b>SETAS</b> ou toque nos botões!</p>
        </div>

        <div class="score-display">Pontos: <span id="score-val">0</span></div>

        <div class="health-bar-container">
            <div id="health-fill" class="health-bar-fill"></div>
        </div>

        <div class="game-container" id="game-container">
            <div id="receptors-bar" class="receptors">
                <div class="receptor-lane"><div id="receptor-0" class="receptor">⬅️</div></div>
                <div class="receptor-lane"><div id="receptor-1" class="receptor">⬇️</div></div>
                <div class="receptor-lane"><div id="receptor-2" class="receptor">⬆️</div></div>
                <div class="receptor-lane"><div id="receptor-3" class="receptor">➡️</div></div>
            </div>

            <div id="feedback-overlay" class="feedback-overlay">
                <h2 id="final-status" style="font-size: 24px; font-weight: bold;">Escolha a Dificuldade</h2>
                <p id="final-msg" style="font-size: 14px; line-height: 1.4;">Selecione o ritmo desejado para começar:</p>
                <div id="btn-area" class="dificuldade-container">
                    <button class="btn-dificuldade btn-facil" onclick="iniciarComDificuldade('facil')"> Fácil</button>
                    <button class="btn-dificuldade btn-medio" onclick="iniciarComDificuldade('medio')"> Médio</button>
                    <button class="btn-dificuldade btn-dificil" onclick="iniciarComDificuldade('dificil')"> Difícil (bem aurudo e dificil mesmo)</button>
                </div>
            </div>
        </div>

        <div class="touch-controls">
            <button class="touch-btn" id="btn-0">⬅️</button>
            <button class="touch-btn" id="btn-1">⬇️</button>
            <button class="touch-btn" id="btn-2">⬆️</button>
            <button class="touch-btn" id="btn-3">➡️</button>
        </div>
    </main>

    <script>
        const container = document.getElementById('game-container');
        const healthFill = document.getElementById('health-fill');
        const scoreVal = document.getElementById('score-val');
        const receptorsBar = document.getElementById('receptors-bar');
        const overlay = document.getElementById('feedback-overlay');
        const receptors = [
            document.getElementById('receptor-0'),
            document.getElementById('receptor-1'),
            document.getElementById('receptor-2'),
            document.getElementById('receptor-3')
        ];

        // Áudios
        const somAcerto = new Audio('AUDIO/du-bist-gut-genug.mp3');
        const somErro = new Audio('AUDIO/fnf-missnote-1.mp3');
        const somDerrota = new Audio('AUDIO/67.mp3');
        const somVitoria = new Audio('AUDIO/manoel-gomes-parabens.mp3');

        let timerAcerto = null;

        function tocarSomAcerto() {
            if (somAcerto.ended) {
                somAcerto.currentTime = 0;
            }
            if (timerAcerto) clearTimeout(timerAcerto);
            somAcerto.play().catch(() => {});
            timerAcerto = setTimeout(() => {
                somAcerto.pause();
            }, 670);
        }

        function tocarSomErro() {
            if (timerAcerto) clearTimeout(timerAcerto);
            somAcerto.pause();
            somErro.currentTime = 0;
            somErro.play().catch(() => {});
        }

        const setasMidia = ['⬅️', '⬇️', '⬆️', '➡️']; 

        let gameActive = false;
        let health = 50;
        let score = 0;
        let notes = [];
        
        let modoAtual = 'medio';
        let baseSpeed = 1.0;
        let currentSpeed = 1.0;
        let spawnRate = 110; 
        let frameCount = 0;

        const keys = {
            'ArrowLeft': 0, 'a': 0, 'A': 0,
            'ArrowDown': 1, 's': 1, 'S': 1,
            'ArrowUp': 2, 'w': 2, 'W': 2,
            'ArrowRight': 3, 'd': 3, 'D': 3
        };

        function aplicarMovimentoAlternado(ativar) {
            receptors.forEach((rec, i) => {
                if (ativar) rec.classList.add(`mov-alt-${i}`);
                else rec.classList.remove(`mov-alt-${i}`);
            });
        }

        function iniciarComDificuldade(nivel) {
            modoAtual = nivel;
            
            // DIFICULDADES E VELOCIDADES REAJUSTADAS
            if (nivel === 'facil') {
                baseSpeed = 0.8;
                spawnRate = 130;
                aplicarMovimentoAlternado(false);
                document.body.classList.remove('modo-escuro-osu');
            } else if (nivel === 'medio') {
                baseSpeed = 1.4;
                spawnRate = 100;
                aplicarMovimentoAlternado(false);
                document.body.classList.remove('modo-escuro-osu');
            } else if (nivel === 'dificil') {
                baseSpeed = 2.8; // Velocidade bem amigável para reação
                spawnRate = 70;
                aplicarMovimentoAlternado(true);
                document.body.classList.add('modo-escuro-osu');
            }

            gameActive = true;
            health = 50;
            score = 0;
            scoreVal.innerText = score;
            frameCount = 0;
            currentSpeed = baseSpeed;
            notes.forEach(n => n.el.remove());
            notes = [];
            overlay.style.display = 'none';
            somAcerto.currentTime = 0;

            gameLoop();
        }

        function gameLoop() {
            if (!gameActive) return;

            frameCount++;

            if (frameCount % 300 === 0) {
                currentSpeed += 0.1; 
                if (spawnRate > 40) {
                    spawnRate -= 2; 
                }
            }

            if (frameCount % Math.round(spawnRate) === 0) {
                createNote();
            }

            for (let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                n.y -= currentSpeed; 
                n.el.style.top = n.y + 'px';

                if (n.y < -20) {
                    n.el.remove();
                    notes.splice(i, 1);
                    tocarSomErro();
                    updateHealth(-6);
                }
            }

            if (health <= 0) endGame(false);
            if (health >= 100) endGame(true);

            requestAnimationFrame(gameLoop);
        }

        function createNote() {
            const lane = Math.floor(Math.random() * 4);
            const el = document.createElement('div');
            el.className = 'note';
            el.innerHTML = setasMidia[lane];
            el.style.left = (lane * 25) + '%'; 
            
            let startY = 420;

            // Teleporte mais previsível no modo Difícil (só surge na metade inferior da tela)
            if (modoAtual === 'dificil' && Math.random() < 0.20) {
                startY = 240 + Math.random() * 60;
                el.classList.add('teleport');
            }

            el.style.top = startY + 'px';
            
            container.appendChild(el);
            notes.push({ el, lane, y: startY });
        }

        function mostrarFeedbackTexto(texto, cor, lane, y) {
            const fb = document.createElement('div');
            fb.className = 'hit-feedback';
            fb.innerText = texto;
            fb.style.color = cor;
            fb.style.left = (lane * 25 + 5) + '%';
            fb.style.top = y + 'px';
            container.appendChild(fb);

            setTimeout(() => fb.remove(), 600);
        }

        function updateHealth(amount) {
            health += amount;
            if (health > 100) health = 100;
            if (health < 0) health = 0;
            healthFill.style.width = health + '%';
            
            if (health > 70) healthFill.style.backgroundColor = '#458b40';
            else if (health > 30) healthFill.style.backgroundColor = '#d9a036';
            else healthFill.style.backgroundColor = '#a63232';
        }

        function triggerInput(lane) {
            if (!gameActive) return;
            receptors[lane].classList.add('active');
            checkHit(lane);
            setTimeout(() => receptors[lane].classList.remove('active'), 100);
        }

        // Teclado
        window.addEventListener('keydown', (e) => {
            const lane = keys[e.key];
            if (lane !== undefined && gameActive) {
                triggerInput(lane);
            }
        });

        // Touch (Mobile)
        [0, 1, 2, 3].forEach(lane => {
            const btn = document.getElementById(`btn-${lane}`);
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                triggerInput(lane);
            });

            btn.addEventListener('click', () => {
                triggerInput(lane);
            });
        });

        function checkHit(lane) {
            const receptorEl = receptors[lane];
            const receptorRect = receptorEl.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            
            const receptorY = receptorRect.top - containerRect.top;

            // 🎯 AREA DE ACERTO BEM AMPLA (HITBOX EXPANDIDA)
            const hitZoneMin = receptorY - 50;
            const hitZoneMax = receptorY + 90;

            for (let i = 0; i < notes.length; i++) {
                let n = notes[i];
                if (n.lane === lane && n.y >= hitZoneMin && n.y <= hitZoneMax) {
                    
                    // Distância exata do centro do receptor
                    const distancia = Math.abs(n.y - receptorY);

                    n.el.remove();
                    notes.splice(i, 1);
                    tocarSomAcerto();

                    // SISTEMA DE PONTUAÇÃO E CURA POR PRECISÃO
                    if (distancia <= 15) {
                        // PERFECT!
                        score += 100;
                        updateHealth(8);
                        mostrarFeedbackTexto('PERFECT!', '#2eec71', lane, receptorY);
                    } else if (distancia <= 35) {
                        // GOOD!
                        score += 50;
                        updateHealth(5);
                        mostrarFeedbackTexto('GOOD', '#f1c40f', lane, receptorY);
                    } else {
                        // OK
                        score += 20;
                        updateHealth(2);
                        mostrarFeedbackTexto('OK', '#e67e22', lane, receptorY);
                    }

                    scoreVal.innerText = score;
                    return;
                }
            }
            
            tocarSomErro();
            updateHealth(-3);
        }

        function endGame(win) {
            gameActive = false;
            aplicarMovimentoAlternado(false);
            document.body.classList.remove('modo-escuro-osu');

            if (timerAcerto) clearTimeout(timerAcerto);
            somAcerto.pause();

            overlay.style.display = 'flex';
            const status = document.getElementById('final-status');
            const msg = document.getElementById('final-msg');
            const btnArea = document.getElementById('btn-area');

            if (win) {
                somVitoria.currentTime = 0;
                somVitoria.play().catch(() => {});

                localStorage.setItem('emblemaMovimento', 'ganhou');
                status.innerText = "RITMO PERFEITO!";
                msg.innerText = `Parabéns! Você fez ${score} pontos no modo ${modoAtual.toUpperCase()} e conquistou o emblema Vida em Movimento.`;
                
                btnArea.className = '';
                btnArea.innerHTML = `
                    <a href="emblemas.html" class="btn-game">Ver meu Emblema</a>
                    <br>
                    <button class="btn-game" onclick="location.reload()" style="margin-top:10px;">Jogar Novamente</button>
                `;
            } else {
                somDerrota.currentTime = 0;
                somDerrota.play().catch(() => {});

                status.innerText = "FORA DE RITMO!";
                msg.innerText = `Sua barra de energia acabou. Você fez ${score} pontos no modo ${modoAtual.toUpperCase()}. Tente novamente!`;
                
                btnArea.className = '';
                btnArea.innerHTML = '<button class="btn-game" onclick="location.reload()">Tentar Novamente</button>';
            }
        }
    </script>

    <footer class="footer">
        <span>Siga-nos</span>
        <div class="social-icons">
            <a href="#" class="icon"><img src="IMG/icons/instagram.png" alt="Instagram"></a>
            <a href="#" class="icon"><img src="IMG/icons/github.png" alt="Github"></a>
        </div>
    </footer>
</body>
</html>
