<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Wellness - Monte seu Prato</title>
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/variables.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/pages/jogo-prato.css">
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="JS/theme.js"></script>
</head>

<body>

    <header class="navbar">
        <div class="logo-area">
            <img src="IMG/logo.png" alt="Cherry Wellness Logo" class="logo-img">
            <span class="logo-text">Cherry Wellness</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="jogo-movimento.html">Vida em movimento</a>
            <a href="alimentacao.html">Prato & Saúde</a>
            <a href="saudemental.html">Bem-Estar mental</a>
            <a href="emblemas.html">Emblemas & Minijogos</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar modo escuro"
            aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41">
                </path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
        </button>
    </header>

    <main class="game-wrapper">

        <section class="comidas-paleta">
            <h3>Alimentos</h3>
            <p>Arraste os emojis para o prato:</p>

            <div class="comidas-grid">
                <div class="comida-card">
                    <div id="alface" class="emoji-arrastavel">🥬</div>
                    <span>Alface</span>
                </div>
                <div class="comida-card">
                    <div id="file-frango" class="emoji-arrastavel">🍗</div>
                    <span>Frango</span>
                </div>
                <div class="comida-card">
                    <div id="arroz" class="emoji-arrastavel">🍚</div>
                    <span>Arroz</span>
                </div>
                <div class="comida-card">
                    <div id="azeite" class="emoji-arrastavel">🫒</div>
                    <span>Azeite</span>
                </div>
                <div class="comida-card">
                    <div id="linguica" class="emoji-arrastavel">🌭</div>
                    <span>Linguiça</span>
                </div>
                <div class="comida-card">
                    <div id="refrigerante" class="emoji-arrastavel">🥤</div>
                    <span>Refri</span>
                </div>
            </div>
        </section>

        <section class="prato-container">
            <h3>Seu Prato</h3>

            <div id="prato-alvo" class="area-prato">
                <p id="texto-ajuda" class="texto-ajuda">
                    Arraste até 4 itens para cá!
                </p>
            </div>

            <div class="botoes-grupo">
                <button class="btn-secondary" onclick="calcularSaude()">
                    Calcular Saúde
                </button>
                <button class="btn-secondary" onclick="recomecarJogo()">
                    Tentar de Novo
                </button>
            </div>

            <div id="area-resultado" style="display: none; width: 100%;">
                <div id="resultado-painel" class="painel-resultado"></div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="IMG/logo.png" alt="" class="footer-logo">
                <span>Cherry Wellness</span>
            </div>
            <div class="footer-social">
                <span class="footer-social-label">Siga-nos</span>
                <div class="social-icons">
                    <a href="#" class="icon" aria-label="Instagram"><img src="IMG/icons/instagram.png" alt=""></a>
                    <a href="#" class="icon" aria-label="Github"><img src="IMG/icons/github.png" alt=""></a>
                </div>
            </div>
        </div>
        <p class="footer-copy">Projeto Integrador &mdash; IFC Araquari</p>
    </footer>

    <script src="JS/pages/jogo-prato.js"></script>
</body>

</html>
