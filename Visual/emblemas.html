<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Wellness - Emblemas & Minijogos</title>
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/variables.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/pages/emblemas.css">
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="JS/theme.js"></script>
</head>

<body>

    <header class="navbar">
        <div class="logo-area">
            <img src="IMG/logo.png" alt="Cherry Wellness Logo" class="logo-img">
            <span class="logo-text">Cherry Wellness</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="jogo-movimento.html">Vida em movimento</a>
            <a href="alimentacao.html">Prato & Saúde</a>
            <a href="saudemental.html">Bem-Estar mental</a>
            <a href="emblemas.html" class="active">Emblemas & Minijogos</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar modo escuro"
            aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41">
                </path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
        </button>
    </header>

    <main class="emblemas-wrapper">
        <h2 class="titulo-pagina" data-reveal="up">Seus Emblemas e Conquistas</h2>
        <p class="subtitulo-pagina" data-reveal="up">Complete os desafios do site para desbloquear insígnias de
            saúde!</p>

        <div id="container-conquistas" class="emblemas-grid"></div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="IMG/logo.png" alt="" class="footer-logo">
                <span>Cherry Wellness</span>
            </div>
            <div class="footer-social">
                <span class="footer-social-label">Siga-nos</span>
                <div class="social-icons">
                    <a href="#" class="icon" aria-label="Instagram"><img src="IMG/icons/instagram.png" alt=""></a>
                    <a href="#" class="icon" aria-label="Github"><img src="IMG/icons/github.png" alt=""></a>
                </div>
            </div>
        </div>
        <p class="footer-copy">Projeto Integrador &mdash; IFC Araquari</p>
    </footer>

    <script src="JS/reveal.js"></script>
    <script src="JS/pages/emblemas.js"></script>
</body>

</html>
